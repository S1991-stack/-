name: Build SALAH Neon Player (EXE & APK)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build

  build-windows-exe:
    needs: verify-and-test
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build:electron
      # Electron 22.3.27 is the last official LTS branch supporting Windows 7 / 8 / 8.1 and also runs on Windows 10 / 11
      - run: npm install --no-save -D electron@22.3.27 electron-builder@24.13.3
      - run: npx electron-builder --config electron/electron-builder.yml --win
      - uses: actions/upload-artifact@v4
        with:
          name: SALAH-Neon-Player-Windows-Setup-EXE
          path: release/*.exe
          if-no-files-found: error

  build-android-apk:
    needs: verify-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
      - run: npm run build
      - run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp public/pwa-512x512.png "$dir/ic_launcher.png" || true
              cp public/pwa-512x512.png "$dir/ic_launcher_round.png" || true
            fi
          done
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SALAH-Neon-Player-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
